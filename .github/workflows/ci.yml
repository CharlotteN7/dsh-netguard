name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      # A path or hostname committed once stays retrievable through `git show`
      # even after it leaves HEAD; only a history rewrite takes it back.
      - name: No local paths or machine names
        run: ./scripts/check-no-local-paths.sh --tree

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # 100% per file. This is a security control: an arm nothing exercises is an
      # arm nobody has checked.
      - name: Unit tests with coverage
        run: pnpm run test:coverage

  e2e:
    name: end-to-end against a real harness (dsh ${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every published rc the peer ranges admit, each pinned exactly: the npm
        # `latest` dist-tag for @deepseek-ai/dsh-* still points at 0.0.1-rc.1, so
        # a floating range would silently resolve to ancient code. A new rc is
        # added here, and the leg that fails names the version that broke.
        dsh: ['0.1.0-rc.6', '0.1.0-rc.7']
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The published CLI, not a monorepo checkout: it needs no source build and
      # resolves its own bundles. `autoInstallPeers` is required because
      # @deepseek-ai/dsh-app-boot declares the vendored cordis plugins as
      # non-optional peers; without it boot dies on a missing
      # @deepseek-ai/cordis-plugin-group. `nodeLinker: hoisted` is what dsh's own
      # profiles use, and the build approvals cover its native dependencies.
      - name: Install the published dsh CLI
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-cli"
          cd "$RUNNER_TEMP/dsh-cli"
          cat > package.json <<'JSON'
          { "name": "dsh-cli-host", "private": true, "type": "module" }
          JSON
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - .
          nodeLinker: hoisted
          autoInstallPeers: true
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            node-pty: true
            koffi: true
            protobufjs: true
            '@google/genai': true
          YAML
          pnpm add -D "@deepseek-ai/dsh@${DSH_VERSION}"
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js

      # Keyless. The mock speaks the OpenAI wire protocol, so the provider
      # adapter, agent loop, tool pipeline, guards and persistence are all real.
      # The fixture server the agent fetches runs in the test process on
      # loopback, which the policy has to open by name.
      - name: End-to-end tests
        env:
          DSH_CLI: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm run test:e2e

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Pinned: an unpinned `pnpm dlx publint` resolves whatever `latest` is on
      # the day the job runs, so a new release can fail a build that changed
      # nothing, or pass one an older release would have failed.
      - name: publint
        run: pnpm dlx publint@0.3.23 --strict

      - name: Are the types wrong?
        run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack --ignore-rules cjs-resolves-to-esm

      # A sibling package once published 1 of its 9 modules because `files` listed the
      # entry point literally. Assert every built module is actually shipped here too.
      - name: Every built module is published
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp > /dev/null
          tarball="$(ls /tmp/dsh-netguard-*.tgz)"
          built="$(find lib -name '*.js' | wc -l)"
          shipped="$(tar tzf "$tarball" | grep -cE '^package/lib/.*\.js$')"
          echo "built=$built shipped=$shipped"
          if [ "$built" -ne "$shipped" ]; then
            echo "::error::$built modules built but $shipped published - check the files field"
            tar tzf "$tarball" | grep '^package/lib/' || true
            exit 1
          fi

      # Prove the tarball works outside this repo's node_modules: the report
      # command is the half of this package a reader runs by hand, and it must
      # not need a profile, a harness, or anything from the dev tree.
      - name: Install the packed tarball and run it
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          spool="$work/decisions.ocsf.jsonl"
          cd "$work"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$(ls /tmp/dsh-netguard-*.tgz)"
          npx dsh-netguard report --spool "$spool" | tee out.txt
          grep -q 'no spool at' out.txt
          printf '%s\n' '{"time":1,"dst_endpoint":{"hostname":"example.com","port":443},"unmapped":{"dsh":{"verdict":"denied","kind":"fetch","enforced":true,"mode":"enforce","reason":"blocked-by-allowlist"}}}' > "$spool"
          npx dsh-netguard report --spool "$spool" --suggest | tee suggest.txt
          grep -q "  - 'example.com'" suggest.txt
